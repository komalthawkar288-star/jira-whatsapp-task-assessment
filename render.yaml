services:
  - type: web
    name: jira-whatsapp-assessment-api
    runtime: docker
    dockerfilePath: ./backend/JiraWhatsAppAssessment.Api/Dockerfile
    dockerContext: ./backend/JiraWhatsAppAssessment.Api
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  - type: web
    name: jira-whatsapp-assessment-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
